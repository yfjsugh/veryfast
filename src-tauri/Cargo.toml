[package]
name = "sf-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "sf_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "net", "fs", "signal", "time", "io-util",
] }
anyhow = "1"
base64 = "0.22"
url = "2"
qrcode = { version = "0.14", features = ["svg"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
